<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14092B">
<meta name="robots" content="noindex">
<title>Danke · Golden Chi mit Lisa Lee</title>
<link rel="alternate" hreflang="de" href="danke.html">
<link rel="alternate" hreflang="en" href="thanks.html">
<style>
@font-face{font-family:"Spectral";font-style:normal;font-weight:300;font-display:swap;src:url("fonts/spectral-latin-300-normal.woff2") format("woff2")}
@font-face{font-family:"Spectral";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/spectral-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Spectral";font-style:italic;font-weight:300;font-display:swap;src:url("fonts/spectral-latin-300-italic.woff2") format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/hanken-grotesk-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:500;font-display:swap;src:url("fonts/hanken-grotesk-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Hanken Grotesk";font-style:normal;font-weight:600;font-display:swap;src:url("fonts/hanken-grotesk-latin-600-normal.woff2") format("woff2")}
</style>
<style>
  :root{
    color-scheme: dark only;
    /* palette: night plum · aubergine · beige · sand · gold */
    --night:       #14092B;
    --plum-black:  #1B0C3A;
    --aubergine:   #2A1458;
    --plum:        #4A22A8;
    --mauve:       #A47CFF;
    --beige:       #FBF7E8;
    --beige-2:     #F0EAD0;
    --linen:       #FFFAEA;
    --cream:       #FCF8E8;
    --cream-2:     #FFFCEE;
    --pearl:       #FFFEF7;
    --blush:       #F8EDC4;
    --gold-ink:    #3E1C96;
    --sand:        #E5DDBA;
    --gold:        #E8D894;
    --gold-light:  #F9EFC3;
    --gold-pale:   #FBF6E0;
    --gold-deep:   #4A22AE;
    --on-dark:     #FBF7E8;
    --on-dark-2:   rgba(251,247,232,.74);
    --on-dark-3:   rgba(251,247,232,.5);
    --ink:         #1E1238;
    --ink-soft:    #4F4470;
    --ink-faint:   #8E86A6;
    --line-dark:   rgba(251,247,232,.12);
    --line-gold:   rgba(157,110,255,.42);
    --line-light:  rgba(30,18,56,.12);
    --gold-grad:   linear-gradient(180deg,#FBF4D8 0%,#F6ECC0 46%,#E9DB9E 100%);
    --gold-grad-hover: linear-gradient(180deg,#FCF8E4 0%,#F8F0CC 46%,#EDE0A8 100%);
    --gold-text:   linear-gradient(100deg,#FBF6E0 0%,#F9EFC3 35%,#E8D894 70%,#F9EFC3 100%);
    --btn-edge:    inset 0 1px 0 rgba(255,250,236,.75),inset 0 -1px 0 rgba(185,168,100,.28);
    --glow:        var(--btn-edge),0 8px 22px -10px rgba(246,226,150,.7),0 0 34px -12px rgba(248,230,160,.55);
    --glow-light:  var(--btn-edge),0 8px 18px -10px rgba(50,25,110,.45);
    --maxw:        1180px;
    --measure:     62ch;
    --ease:        cubic-bezier(.22,.61,.36,1);
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:84px;background:var(--night)}
  body{
    margin:0;background:var(--plum-black);color:var(--on-dark);
    font-family:"Hanken Grotesk", system-ui, sans-serif;
    font-size:1.05rem;line-height:1.75;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  img{max-width:100%}
  .wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:clamp(1.35rem,5vw,3.25rem)}
  ::selection{background:rgba(157,110,255,.35);color:inherit}

  h1,h2,h3{font-family:"Spectral",Georgia,serif;font-weight:300;letter-spacing:-.012em;line-height:1.1;color:var(--on-dark);margin:0}
  h1 em,h2 em{font-style:italic;font-weight:300}
  .gold-text,h1 em,.final h2 em,.stimmen-title,.turn .l2{background:var(--gold-text);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .kicker{max-width:none;display:inline-flex;align-items:center;gap:.9rem;font-size:.7rem;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-light);margin:0 0 1.6rem}
  .kicker::before{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
  .center{text-align:center}
  .center .kicker{justify-content:center}
  .center .kicker::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,currentColor,transparent)}
  p{max-width:var(--measure)}
  a{color:inherit}
  .muted{color:var(--on-dark-2)}

  .sec-head{max-width:60ch;margin-bottom:clamp(2.4rem,5vw,3.8rem)}
  .sec-head.center{margin-inline:auto;max-width:780px}
  .sec-head h2{font-size:clamp(1.9rem,3.6vw,3rem)}
  .sec-intro{font-size:1.04rem;color:var(--on-dark-2);max-width:54ch;margin:1.2rem 0 0}
  .center .sec-intro{margin-inline:auto}

  section{position:relative;padding-block:clamp(4.5rem,9vw,8rem)}

  /* light (beige) sections */
  .light{background:var(--beige);color:var(--ink)}
  .light h2,.light h3{color:var(--ink)}
  .light .kicker{color:var(--gold-ink)}
  .light .sec-intro,.light .muted{color:var(--ink-soft)}

  /* soft warm glow orbs */
  .glow-orb{position:absolute;border-radius:50%;pointer-events:none;filter:blur(10px);z-index:0;
    background:radial-gradient(circle,rgba(248,234,168,.22) 0%,rgba(248,234,168,.08) 40%,transparent 70%);animation:drift 22s ease-in-out infinite alternate}
  @keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(40px,-30px,0) scale(1.12)}}
  section>.wrap{position:relative;z-index:1}

  /* ---------- BUTTONS ---------- */
  .btn{position:relative;overflow:hidden;isolation:isolate;backface-visibility:hidden;background-clip:padding-box;display:inline-flex;align-items:center;gap:.65rem;font-family:"Hanken Grotesk",sans-serif;font-weight:600;font-size:.86rem;
    letter-spacing:.09em;text-transform:uppercase;text-decoration:none;white-space:nowrap;cursor:pointer;padding:1rem 1.8rem;border-radius:999px;
    border:1px solid transparent;transition:background .5s var(--ease),color .5s var(--ease),border-color .5s var(--ease),box-shadow .6s var(--ease),transform .5s var(--ease)}
  /* gold buttons: primary, light */
  .btn-primary,.btn-light{background:var(--gold-grad);background-clip:padding-box;color:#1E1238;border:1px solid #CBBB7C;box-shadow:var(--glow)}
  .btn-primary::after,.btn-light::after{content:"";position:absolute;inset:0;z-index:-1;
    background:linear-gradient(110deg,transparent 35%,rgba(255,252,240,.55) 50%,transparent 65%);transform:translateX(-120%);transition:transform 1.1s var(--ease)}
  .btn-primary:hover::after,.btn-light:hover::after{transform:translateX(120%)}
  .btn-primary:hover,.btn-light:hover{background:var(--gold-grad-hover);background-clip:padding-box;transform:translateY(-1px);box-shadow:var(--btn-edge),0 12px 28px -10px rgba(246,226,150,.8),0 0 46px -12px rgba(248,230,160,.6)}
  .shine::after{animation:sheen 7s ease-in-out 2.5s infinite}
  @keyframes sheen{0%,72%{transform:translateX(-120%)}88%,100%{transform:translateX(120%)}}
  /* outline buttons */
  .btn-ghost,.btn-line-light{background:rgba(157,110,255,.05);color:var(--gold-light);border:1px solid rgba(249,239,195,.62)}
  .btn-ghost:hover,.btn-line-light:hover{border-color:var(--gold-light);color:var(--gold-pale);background:rgba(157,110,255,.12);box-shadow:0 0 34px -10px rgba(248,230,160,.55)}
  .light .btn-ghost{color:var(--gold-ink);border-color:rgba(62,28,150,.55);background:transparent}
  .light .btn-ghost:hover{background:var(--gold-grad);color:#1E1238;border-color:#CBBB7C;box-shadow:var(--glow-light)}
  .btn .arrow{transition:transform .5s var(--ease)}
  .btn:hover .arrow{transform:translateX(4px)}

  /* ---------- HEADER ---------- */
  header.bar{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .6s var(--ease),border-color .6s var(--ease);border-bottom:1px solid transparent;color:var(--on-dark)}
  header.bar.scrolled{background:rgba(20,9,43,.82);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-color:var(--line-dark)}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:1.15rem}
  .brand{display:flex;align-items:center;gap:.75rem;font-family:"Spectral",serif;font-size:1.15rem;letter-spacing:.02em;text-decoration:none;color:inherit;white-space:nowrap}
  .brand .glyph{width:24px;height:24px;flex:none;filter:drop-shadow(0 0 5px rgba(248,234,168,.6))}
  .brand .glyph circle{fill:none;stroke:var(--gold-light);stroke-width:1.6;stroke-linecap:round}
  nav.links{display:flex;align-items:center;gap:2.1rem;font-size:.86rem;letter-spacing:.04em}
  nav.links a:not(.btn){text-decoration:none;color:inherit;opacity:.78;transition:opacity .3s,color .3s}
  nav.links a:not(.btn):hover{opacity:1;color:var(--gold-pale)}
  .bar .btn{padding:.72rem 1.3rem;font-size:.74rem}
  .lang-switch{display:flex;align-items:center;gap:.45rem;font-size:.74rem;font-weight:600;letter-spacing:.1em}
  .lang-switch a{text-decoration:none}
  .lang-switch a.is-current{opacity:1!important;color:var(--gold-light);border-bottom:1px solid currentColor}
  .lang-switch .sep{opacity:.4}
  @media(max-width:900px){nav.links a.hide-sm{display:none}}
  @media(max-width:480px){
    .bar .wrap{padding-inline:1rem}
    .brand{font-size:.9rem;gap:.45rem}
    .brand .glyph{width:20px;height:20px}
    nav.links{gap:.8rem}
    .lang-switch{font-size:.68rem;gap:.3rem}
    .bar .btn{padding:.55rem .8rem;font-size:.64rem;letter-spacing:.04em}
  }
  @media(max-width:420px){.bar .brand-sub{display:none}}

  .bg-video{filter:saturate(.5) sepia(.25) brightness(.92)}

  /* ---------- HERO ---------- */
  .hero{position:relative;overflow:hidden;min-height:min(100svh,920px);display:flex;align-items:flex-end;color:var(--on-dark);background:var(--night);
    padding-top:clamp(7rem,14vw,10rem);padding-bottom:clamp(4rem,8vw,6.5rem)}
  .hero .bg-video{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}
  .hero .bg-scrim{position:absolute;inset:0;z-index:1;background:
      linear-gradient(180deg,rgba(20,9,43,.62) 0%,rgba(20,9,43,.38) 38%,rgba(20,9,43,.9) 100%),
      radial-gradient(70% 55% at 12% 95%,rgba(248,230,160,.24),transparent 70%),
      radial-gradient(50% 45% at 92% 8%,rgba(127,61,255,.16),transparent 70%)}
  .hero .wrap{position:relative;z-index:2;width:100%}
  .hero h1{font-size:clamp(2.8rem,6.6vw,5.8rem);line-height:1.02;max-width:14ch;margin:0 0 1.8rem;color:var(--beige)}
  .hero h1 em{filter:drop-shadow(0 0 24px rgba(248,230,160,.35));animation:goldflow 12s ease-in-out infinite alternate}
  @keyframes goldflow{to{background-position:100% 0}}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:2rem 4rem;align-items:end}
  @media(max-width:860px){.hero-grid{grid-template-columns:1fr}}
  .hero .lead{font-family:"Spectral",serif;font-weight:300;font-size:clamp(1.15rem,1.8vw,1.42rem);line-height:1.6;color:var(--on-dark-2);max-width:44ch;margin:0 0 2.4rem}
  .hero-cta{display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
  .hero-note{font-size:.88rem;line-height:1.6;color:var(--on-dark-3);margin:0;padding-left:1.4rem;border-left:1px solid var(--line-gold);max-width:30ch}
  .scroll-cue{position:absolute;left:50%;bottom:1.4rem;z-index:2;width:1px;height:46px;background:linear-gradient(rgba(249,239,195,0),rgba(249,239,195,.8));overflow:hidden}
  .scroll-cue::after{content:"";position:absolute;left:0;top:-46px;width:1px;height:46px;background:var(--gold-pale);animation:cue 2.8s var(--ease) infinite}
  @keyframes cue{to{top:46px}}
  @media(max-width:860px){.scroll-cue{display:none}}

  /* ---------- ENSO ---------- */
  .enso{position:relative;width:clamp(120px,15vw,200px);aspect-ratio:1;pointer-events:none}
  .enso::before{content:"";position:absolute;inset:-25%;border-radius:50%;background:radial-gradient(circle,rgba(248,230,160,.2),transparent 62%);animation:breathe 11s ease-in-out infinite}
  .enso svg{position:relative;z-index:1;width:100%;height:100%;overflow:visible;transform-origin:center;animation:breathe 11s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(248,230,160,.55))}
  .enso .ring{fill:none;stroke:var(--gold-light);stroke-width:4;stroke-linecap:round;stroke-dasharray:1980;stroke-dashoffset:1980}
  .reveal.in .enso .ring{animation:draw 3.6s cubic-bezier(.6,.02,.2,1) .2s forwards}
  .qi{position:absolute;inset:0;z-index:2;animation:spin 24s linear 3.6s infinite}
  .qi .dot{position:absolute;left:50%;top:4%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--gold-pale);box-shadow:0 0 10px 3px rgba(251,246,224,.9),0 0 26px 6px rgba(248,230,160,.55);opacity:0}
  .reveal.in .qi .dot{animation:fadein 1.2s ease 3.4s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes breathe{0%,100%{transform:scale(.965)}45%{transform:scale(1.025)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadein{to{opacity:1}}

  /* ---------- RECOGNITION ---------- */
  .recog{background:linear-gradient(180deg,var(--night) 0%,var(--plum-black) 100%);overflow:hidden}
  .recog .glow-orb{width:620px;height:620px;right:-180px;top:30%}
  .points-row{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(1.4rem,3vw,2.6rem);counter-reset:pt;margin-top:.6rem}
  @media(max-width:900px){.points-row{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.points-row{grid-template-columns:1fr}}
  .points-row p{margin:0;max-width:none;padding-top:1.3rem;border-top:1px solid var(--line-gold);font-size:1.04rem;line-height:1.6;color:var(--on-dark);counter-increment:pt}
  .points-row p::before{content:counter(pt,upper-roman);display:block;font-family:"Spectral",serif;font-style:italic;font-size:1.05rem;color:var(--gold-light);margin-bottom:.7rem;letter-spacing:.06em;text-shadow:0 0 14px rgba(248,230,160,.45)}
  .turn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(2rem,6vw,5.5rem);align-items:center;max-width:920px;margin:clamp(4rem,8vw,6.5rem) auto 0}
  @media(max-width:640px){.turn{grid-template-columns:1fr;justify-items:center;text-align:center}}
  .turn .l1{font-family:"Spectral",serif;font-weight:300;font-size:clamp(1.1rem,1.6vw,1.3rem);line-height:1.45;color:var(--on-dark-2);margin:0 0 .9rem}
  .turn .l2{font-family:"Spectral",serif;font-style:italic;font-weight:300;font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.12;margin:0 0 1.3rem;max-width:none;padding-bottom:.08em}
  .turn .l3{font-size:1.04rem;color:var(--on-dark-2);margin:0;max-width:44ch}
  @media(max-width:640px){.turn .l3{margin-inline:auto}}

  /* ---------- PRACTICE (beige) ---------- */
  #praxis{background:linear-gradient(180deg,var(--cream) 0%,var(--blush) 100%);overflow:hidden}
  #praxis h2{color:var(--ink)}
  #praxis .kicker{color:var(--gold-ink)}
  #praxis .sec-intro{color:var(--ink-soft)}
  #praxis .glow-orb{width:700px;height:700px;left:50%;top:-260px;margin-left:-350px;background:radial-gradient(circle,rgba(255,250,225,.85) 0%,rgba(248,237,196,.3) 40%,transparent 70%)}
  .practice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(1.2rem,2.4vw,2rem)}
  @media(max-width:860px){.practice-grid{grid-template-columns:1fr;max-width:560px;margin-inline:auto}}
  .practice{position:relative;overflow:hidden;isolation:isolate;padding:clamp(2.2rem,3.6vw,3rem) clamp(1.8rem,3vw,2.4rem) clamp(2.2rem,3.6vw,2.8rem);
    background:linear-gradient(180deg,rgba(255,254,246,.9),rgba(255,253,240,.72));border:1px solid rgba(157,110,255,.38);border-radius:200px 200px 22px 22px;
    box-shadow:0 30px 60px -45px rgba(40,20,90,.5),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .8s var(--ease),box-shadow .8s var(--ease);text-align:center}
  .practice:hover{transform:translateY(-6px);box-shadow:0 40px 70px -40px rgba(40,20,90,.5),0 0 50px -14px rgba(248,230,160,.55),inset 0 1px 0 rgba(255,255,255,.9)}
  .practice .glyph-zh{display:block;font-family:"Spectral",serif;font-size:clamp(3rem,5vw,4rem);line-height:1;margin:1.2rem 0 1.6rem;letter-spacing:.08em;
    background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;opacity:.6}
  .practice h3{font-size:1.75rem;font-weight:300;margin:0 0 .5rem;color:var(--ink)}
  .practice .zh{font-size:.7rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--gold-ink);margin:0 auto 1.3rem;max-width:none}
  .practice p:last-child{font-size:1rem;color:var(--ink-soft);margin:0 auto;max-width:34ch}

  /* ---------- COURSES ---------- */
  #kurse{background:var(--plum-black);overflow:hidden}
  #kurse .glow-orb{width:560px;height:560px;left:-160px;bottom:-120px}
  .course-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(2rem,5vw,4.5rem);max-width:980px;margin-inline:auto}
  @media(max-width:760px){.course-grid{grid-template-columns:1fr;max-width:460px}}
  .course{display:flex;flex-direction:column;align-items:center;text-align:center}
  .course .arch{position:relative;width:100%;aspect-ratio:4/4.4;border-radius:999px 999px 18px 18px;overflow:hidden;background:var(--aubergine);margin-bottom:2rem;
    box-shadow:0 0 0 1px var(--line-gold),0 40px 80px -50px rgba(0,0,0,.9),0 0 60px -20px rgba(248,230,160,.3)}
  .course .arch::after{content:"";position:absolute;inset:10px;border:1px solid rgba(251,246,224,.55);border-radius:999px 999px 12px 12px;pointer-events:none}
  .course img{display:block;width:100%;height:100%;object-fit:cover;filter:sepia(.18) saturate(.85);transition:transform 1.6s var(--ease)}
  .course:hover img{transform:scale(1.04)}
  .course .o-tag{font-size:.7rem;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--gold-light)}
  .course .when{font-family:"Spectral",serif;font-weight:300;font-size:clamp(1.9rem,3vw,2.5rem);line-height:1.15;color:var(--beige);margin:.6rem auto .4rem}
  .course h3{font-family:"Spectral",serif;font-style:italic;font-size:1.3rem;font-weight:400;color:var(--sand);margin:0}
  .course .where{font-size:.95rem;color:var(--on-dark-2);margin:.35rem auto 1.6rem}
  .courses-note{margin:clamp(2.6rem,5vw,3.6rem) auto 0;max-width:52ch;text-align:center;font-size:.96rem;color:var(--on-dark-3)}

  /* ---------- VOICES ---------- */
  .stimmen{position:relative;overflow:hidden;isolation:isolate;background:var(--night);color:var(--on-dark);border-block:1px solid var(--line-dark)}
  .stimmen .bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
  .stimmen .bg-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(20,9,43,.82),rgba(20,9,43,.9)),radial-gradient(60% 55% at 50% 45%,rgba(248,230,160,.18),transparent 70%)}
  .stimmen .wrap{position:relative;z-index:2}
  .stimmen-title{font-family:"Spectral",serif;font-style:italic;font-weight:300;font-size:clamp(2.2rem,4.4vw,3.4rem);text-align:center;margin:0 auto clamp(2.4rem,5vw,3.4rem);display:table;padding-bottom:.1em}
  .slider{max-width:760px;margin:0 auto}
  .slides{display:grid}
  .slide{grid-area:1/1;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity 1s var(--ease),transform 1s var(--ease),visibility 0s 1s;
    background:linear-gradient(180deg,var(--pearl),var(--cream));border-radius:28px;padding:clamp(2rem,4vw,3.2rem);color:var(--ink);
    box-shadow:0 0 0 1px rgba(157,110,255,.45),0 40px 90px -50px rgba(0,0,0,.9),0 0 80px -30px rgba(248,230,160,.45)}
  .slide.is-active{opacity:1;visibility:visible;transform:none;transition:opacity 1s var(--ease),transform 1s var(--ease),visibility 0s}
  .slide::before{content:"\201C";display:block;font-family:"Spectral",serif;font-size:4.2rem;line-height:.6;margin-bottom:1rem;
    background:linear-gradient(135deg,#7A52D8,#4A22AE);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
  .slide blockquote{margin:0;font-family:"Spectral",serif;font-weight:400;font-size:clamp(1.04rem,1.5vw,1.2rem);line-height:1.65;color:var(--ink)}
